apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: folder
  importDerivedRoles:
    - document_management_roles
  rules:
    - actions: ["ViewFolder"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - owner
        - editor
        - viewer
        - org_member
    - actions: ["EditFolder", "ShareFolder"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - owner
        - editor
    - actions: ["DeleteFolder"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - owner
